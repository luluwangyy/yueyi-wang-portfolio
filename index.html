<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Yueyi Lulu Wang — Design Engineer &amp; Creative Technologist</title>
  <meta name="description" content="Portfolio of Yueyi Lulu Wang, a design engineer who prototypes &amp; builds interactive experiences across digital and physical interfaces.">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:ital,wght@0,400..700;1,400..700&amp;family=Averia+Serif+Libre:ital,wght@0,300;1,300&amp;family=VT323&amp;display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/reset.css">
  <link rel="stylesheet" href="css/style.css?v=view-work-button-3">
</head>
<body class="home-page entry-pending">

  <div class="entry-portal" data-entry-portal role="dialog" aria-modal="true" aria-label="Enter Yueyi Lulu Wang’s portfolio">
    <div class="entry-portal__field" aria-hidden="true"></div>

    <div class="entry-portal__content">
      <button class="entry-portal__sound" type="button" data-entry-sound>
        <span class="entry-portal__scroll-mark" aria-hidden="true"><i></i></span>
        <span data-entry-sound-label>Enter with sound</span>
      </button>

      <button class="entry-portal__muted" type="button" data-entry-muted>Enter muted</button>
    </div>
  </div>

  <div class="home-top">
    <div id="liquid-ether-root" class="liquid-ether-root" aria-hidden="true"></div>

    <header class="site-header">
      <div class="header-inner">
        <nav class="segmented-control" aria-label="Primary">
          <span class="segmented-control__pill" aria-hidden="true"></span>
          <a href="index.html" class="segmented-control__item is-active" aria-current="page">Home</a>
          <a href="work.html" class="segmented-control__item">Work</a>
          <a href="make.html" class="segmented-control__item">Make</a>
          <a href="about.html" class="segmented-control__item">About</a>
        </nav>
      </div>
    </header>

    <main>
      <section id="top" class="hero hero--statement">
        <div class="hero-inner hero-inner--statement">
          <h1
            class="home-statement"
            data-home-intro
            aria-label="I’m a design engineer who prototypes and builds interactive experiences across digital and physical interfaces."
          >
            I’m a <span class="home-role">design engineer</span> who
            <a class="hero-verbs" href="work.html" aria-label="View design engineering work">
              <span>prototypes</span> &amp; <span>builds</span>
            </a>
            <span class="home-interactive">interactive experiences</span> across digital and physical interfaces.
            <button
              class="home-intro-sound"
              type="button"
              data-home-intro-sound
              aria-label="Replay intro with sound"
              title="Replay with sound"
            >
              <svg viewBox="0 0 20 20" fill="none" aria-hidden="true">
                <path d="M3.5 8h3l3.5-3v10l-3.5-3h-3V8Z" stroke="currentColor" stroke-width="1.35" stroke-linejoin="round"/>
                <path d="M13 7.25c.8.7 1.2 1.62 1.2 2.75s-.4 2.05-1.2 2.75M15.2 5.3c1.35 1.2 2.02 2.76 2.02 4.7s-.67 3.5-2.02 4.7" stroke="currentColor" stroke-width="1.35" stroke-linecap="round"/>
              </svg>
            </button>
          </h1>

          <div class="hero-actions">
            <a
              class="specular-button specular-button--lg hero-cta"
              href="work.html"
              style="--sb-radius:999px; --sb-tint:#ffffff; --sb-tint-opacity:0; --sb-blur:0px; --sb-text-color:#232a35;"
            >
              <span class="specular-button__label">
                View My Work
                <svg class="hero-cta-arrow" viewBox="0 0 16 16" fill="none" aria-hidden="true">
                  <path d="M3 8h10M9 4l4 4-4 4" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
              </span>
            </a>

          </div>

        </div>
      </section>
    </main>
  </div>

  <footer class="site-footer home-footer">
    <div class="footer-inner">
      <span>© 2026 Yueyi Lulu Wang</span>
      <div class="footer-links">
        <a href="mailto:lulu.yueyi.wang@gmail.com">Email</a>
        <a href="https://github.com/luluwangyy" target="_blank" rel="noopener">GitHub</a>
      </div>
    </div>
  </footer>

  <script src="js/main.js?v=ui-sound-2"></script>
  <script type="module" src="js/home-effects.js?v=scroll-sound-1"></script>
  <script src="js/mouse-trail.js"></script>
</body>
</html>
